# Runs the tests on every push and pull request, against an empty throwaway Postgres (never the live database).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: studywithahmad
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/studywithahmad
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API, syllabus and JavaScript checks
        run: uv run --with pytest --with httpx pytest -v

      - name: Install the browser
        run: uv run --with playwright python -m playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          uv run website > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:8000 uv run --with pytest --with httpx --with playwright pytest -v tests/test_ui.py

      - name: Server log
        if: failure()
        run: cat server.log || true
