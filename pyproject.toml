[project]
name = "study-with-ahmad"
version = "0.1.0"
description = "Study with Ahmad: a free study planner for Punjab Board Matric and Inter students (FastAPI + Neon Postgres)"
readme = "README.md"
authors = [
    { name = "Ahmad Ansari", email = "ahmadansari2377@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
website = "website:main"
reset-code = "website.server:admin_code"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# the package folder is src/website (also the `uv run website` command)
module-name = "website"
