# Render Blueprint — deploys Study with Ahmad as a web service.
# Render reads this file when you choose "New → Blueprint" and pick this repo.
services:
  - type: web
    name: study-with-ahmad          # the free link becomes https://study-with-ahmad.onrender.com
    runtime: python
    plan: free
    buildCommand: pip install uv==0.12.23 && uv sync --frozen
    startCommand: uv run --frozen website
    healthCheckPath: /api/health
    autoDeploy: true                # every push to GitHub updates the live site
    envVars:
      - key: DATABASE_URL           # paste your Neon URL in the Render dashboard (never commit it)
        sync: false
      - key: FORWARDED_ALLOW_IPS    # trust Render's proxy so login limits see real visitor IPs
        value: "*"
